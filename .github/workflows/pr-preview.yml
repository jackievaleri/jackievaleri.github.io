name: Deploy PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo CLI
        if: github.event.action != 'closed'
        run: |
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o /tmp/hugo.deb \
          && sudo dpkg -i /tmp/hugo.deb

      - name: Setup Go
        if: github.event.action != 'closed'
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        if: github.event.action != 'closed'
        run: npm install

      - name: Build with Hugo
        if: github.event.action != 'closed'
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo mod tidy
          hugo --gc --minify --baseURL "https://jackievaleri.github.io/pr-preview/pr-${{ github.event.number }}/"

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./public/
          preview-branch: master
          umbrella-dir: pr-preview
